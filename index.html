<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Notebook</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
</head>
<body>

  <div class="toolbar">
    <div class="title">📓 Digital Notebook</div>

    <button class="tool active" id="penBtn">✏️ Pen</button>
    <button class="tool" id="eraserBtn">🧽 Eraser</button>
    <input type="color" id="colorPicker" value="#2B2E38" title="Pen color">
    <input type="range" id="sizeSlider" min="1" max="20" value="3" title="Pen size">

    <button class="tool" id="moveBtn">🖐️ Move / Resize</button>
    <button class="tool" id="imageBtn">🖼️ Insert Image</button>
    <input type="file" id="imageLoader" accept="image/*">
    <button class="tool" id="deleteImgBtn">❌ Remove Image</button>

    <button class="tool" id="ocrBtn">🤖 Handwriting → Text</button>
    <button class="tool" id="addTextBtn">🔤 Add Text</button>

    <button class="tool" id="clearBtn">🗑️ Clear Page</button>
  </div>

  <div class="stage">
    <div class="page-wrap">
      <div id="imagesLayer"></div>
      <canvas id="inkCanvas" width="750" height="960"></canvas>
    </div>
  </div>

  <div class="pagebar">
    <button id="prevBtn">← Prev</button>
    <div class="label" id="pageLabel">Page 1 of 1</div>
    <button id="nextBtn">Next →</button>
    <button id="addBtn">+ New Page</button>
  </div>
  <div class="hint">Pen mode: draw. Move mode: drag pasted images/text or resize with the corner handle. Double-tap text to edit it.</div>

  <div class="ocr-progress hidden" id="ocrProgress">
    <div class="spinner"></div>
    <div id="ocrProgressLabel">Reading your handwriting…</div>
  </div>

  <div class="modal-backdrop hidden" id="ocrModal">
    <div class="modal">
      <h3>Recognized text</h3>
      <p class="sub">Edit anything that came out wrong, then insert it as a text box on the page.</p>
      <textarea id="ocrResultText"></textarea>
      <div class="modal-actions">
        <button id="ocrCancelBtn">Cancel</button>
        <button id="ocrCopyBtn">Copy</button>
        <button class="primary" id="ocrInsertBtn">Insert as Text</button>
      </div>
    </div>
  </div>

  <!-- Load order matters: each file below can use functions/variables
       defined in the ones before it. app.js must be last since it
       boots the app using everything else. -->
  <script src="js/storage.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/images.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/handwriting.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
